<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1552a8">
<meta name="color-scheme" content="light">
<title>매일 생활한국어 · (주)동양싸이로</title>
<style>
  :root{color-scheme:light;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Nanum Gothic",sans-serif;
    background:#eef3fa;color:#16233a;line-height:1.35;overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .app{max-width:540px;margin:0 auto;height:100vh;height:100dvh;
    display:flex;flex-direction:column;gap:6px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));}

  /* 상단 */
  .top{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .brand{min-width:0;flex:1;}
  .brand .co{font-size:11.5px;font-weight:800;color:#5b6b84;letter-spacing:.2px;}
  .brand h1{font-size:17px;font-weight:900;color:#12233d;letter-spacing:-.4px;line-height:1.15;}

  /* 날짜/일차 선택 바 */
  .daybar{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;padding-bottom:2px;
    scrollbar-width:none;-ms-overflow-style:none;}
  .daybar::-webkit-scrollbar{display:none;}
  .daybtn{flex:0 0 auto;border:1.5px solid #cfdcee;background:#fff;color:#3d4f6a;
    font-family:inherit;font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;}
  .daybtn.on{background:#1552a8;border-color:#1552a8;color:#fff;}
  .daybtn.lock{opacity:.45;cursor:default;}

  /* 탭 */
  .tabs{display:flex;gap:4px;flex:0 0 auto;background:#fff;border-radius:99px;padding:4px;
    box-shadow:0 2px 8px rgba(20,40,80,.08);}
  .tab{flex:1;border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:900;
    color:#5a6474;padding:8px 2px;border-radius:99px;cursor:pointer;white-space:nowrap;}
  .tab.on{background:#1552a8;color:#fff;}
  .pbar{flex:0 0 auto;height:5px;background:#dbe5f2;border-radius:99px;overflow:hidden;}
  .pbar i{display:block;height:100%;width:0;background:#2e9e5b;border-radius:99px;transition:width .25s ease;}

  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  #p-read .card{justify-content:center;}
  .panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;}

  /* 카드 */
  .card{flex:1 1 auto;min-height:0;background:#fff;border-radius:20px;padding:10px 12px;
    box-shadow:0 6px 20px rgba(20,40,80,.10);display:flex;flex-direction:column;align-items:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .chip{font-size:12px;font-weight:900;padding:4px 10px;border-radius:99px;align-self:flex-start;}
  .chip.factory{background:#fff0e0;color:#b45a00;}
  .chip.life{background:#e7f7ec;color:#1b7a3d;}
  .emoji{font-size:clamp(26px,7.4vw,34px);line-height:1.1;margin:2px 0 0;}
  .sent{width:100%;text-align:center;font-size:clamp(19px,5.9vw,26px);font-weight:900;line-height:1.34;
    color:#0f2340;letter-spacing:-.6px;word-break:keep-all;padding:6px 4px;border-radius:14px;cursor:pointer;
    transition:background .15s,color .15s;}
  .sent:active,.sent.playing{background:#e8f1ff;}
  .words{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:100%;margin-top:2px;}
  .wchip{background:#f1f5fb;border:1px solid #dde7f4;border-radius:9px;padding:3px 8px;
    font-size:12px;font-weight:800;color:#2b4262;}
  .wchip b{color:#1552a8;}
  .when{margin-top:5px;font-size:12.5px;font-weight:800;color:#6b7a90;text-align:center;word-break:keep-all;}
  .tip{margin-top:6px;font-size:11.5px;font-weight:800;color:#95a4bb;text-align:center;}

  /* 4초 카운트다운 */
  .cd{width:100%;margin-top:8px;height:0;overflow:hidden;opacity:0;transition:opacity .2s;}
  .cd.on{opacity:1;height:auto;padding-top:2px;}  .cd-head{display:flex;align-items:center;justify-content:center;gap:8px;}
  .cd-txt{font-size:14.5px;font-weight:900;color:#b35400;white-space:nowrap;}
  .cd-num{font-size:26px;font-weight:900;color:#e07a00;min-width:26px;text-align:center;line-height:1;}
  .cd-track{width:100%;height:12px;background:#ffe6c7;border-radius:99px;overflow:hidden;margin-top:5px;}
  .cd-track i{display:block;height:100%;width:100%;background:#f59a1a;border-radius:99px;}

  /* 버튼 */
  .row{display:flex;gap:6px;flex:0 0 auto;}
  .btn{border:0;border-radius:14px;font-family:inherit;font-weight:900;cursor:pointer;
    padding:11px 6px;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:4px;
    background:#fff;color:#1c3a63;box-shadow:0 2px 8px rgba(20,40,80,.10);}
  .btn.on{background:#1552a8;color:#fff;}
  .btn.listen{flex:1.15;background:#1552a8;color:#fff;font-size:16px;}
  .btn.slow{flex:1;background:#0f8a57;color:#fff;font-size:16px;}
  .btn.stop{flex:1;background:#b3261e;color:#fff;font-size:16px;}
  .btn.nav{flex:1;font-size:15px;}
  .btn.small{flex:1;font-size:13.5px;padding:9px 4px;color:#3d4f6a;}
  .btn:disabled{opacity:.45;}

  .idx{flex:0 0 74px;text-align:center;font-size:15px;font-weight:900;color:#6b7a90;
    display:flex;align-items:center;justify-content:center;}
  .idx b{color:#1552a8;font-size:19px;}

  /* 전체 목록 시트 */
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.45);display:flex;align-items:flex-end;}
  .sheet-in{width:100%;max-height:86vh;background:#fff;border-radius:20px 20px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));
    overflow-y:auto;}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .sheet-h b{font-size:15px;color:#12233d;}
  .sheet-h button{border:0;background:#eef3fa;color:#2b4262;font-family:inherit;font-weight:900;
    border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;}
  .item{display:flex;gap:8px;align-items:center;padding:10px 8px;border-radius:12px;cursor:pointer;}
  .item:active{background:#eef3fa;}
  .item .n{flex:0 0 24px;height:24px;border-radius:50%;background:#e8f1ff;color:#1552a8;
    font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .item .t{flex:1;font-size:15px;font-weight:800;color:#16233a;word-break:keep-all;}
  .item .c{font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:99px;}
  .item .c.factory{background:#fff0e0;color:#b45a00;}
  .item .c.life{background:#e7f7ec;color:#1b7a3d;}

  /* 퀴즈 */
  .qbar{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;padding:0 4px;}
  .qbar span{font-size:13px;font-weight:900;color:#5b6b84;}
  .qbar b{color:#1552a8;font-size:15px;}
  .qcard{align-items:stretch;padding:11px 11px 9px;}
  .qtop{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .qtag{align-self:flex-start;background:#e8f1ff;color:#1552a8;font-size:11.5px;font-weight:900;
    padding:3px 9px;border-radius:99px;}
  .qtext{margin-top:6px;font-size:clamp(16px,4.6vw,19px);font-weight:900;line-height:1.42;color:#0f2340;
    word-break:keep-all;letter-spacing:-.3px;}
  .qsay{border:1.5px solid #cfdcee;background:#f7fafd;color:#1552a8;font-family:inherit;
    font-size:12px;font-weight:900;border-radius:99px;padding:4px 9px;cursor:pointer;white-space:nowrap;}
  .qcard.answered .qtext{font-size:clamp(15px,4.2vw,17px);}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1.5px solid #d7e2f0;
    background:#fff;border-radius:13px;padding:9px 10px;font-family:inherit;font-size:clamp(14px,4vw,16px);
    font-weight:800;color:#1c2b45;line-height:1.35;cursor:pointer;word-break:keep-all;}
  .opt .mk{flex:0 0 24px;height:24px;border-radius:50%;background:#eef3fa;color:#3d4f6a;
    font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .opt.correct{border-color:#1b8f52;background:#eaf8ef;}
  .opt.correct .mk{background:#1b8f52;color:#fff;}
  .opt.wrong{border-color:#c0392b;background:#fdeceb;}
  .opt.wrong .mk{background:#c0392b;color:#fff;}
  .opt.dim{opacity:.55;}
  .fb{margin-top:7px;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:800;line-height:1.4;
    word-break:keep-all;}
  .fb.ok{background:#eaf8ef;color:#14663c;border:1px solid #b9e3c9;}
  .fb.no{background:#fdeceb;color:#98251a;border:1px solid #f2c2bd;}
  .fb b{display:block;font-size:14px;margin-bottom:1px;}

  /* 짧은 화면(360×584·640) 압축 */
  @media (max-height:700px){
    .app{gap:4px;padding:6px 8px;}
    .brand .co{display:none;}
    .brand h1{font-size:15.5px;}
    .daybtn{font-size:12px;padding:5px 10px;}
    .tab{font-size:12.5px;padding:7px 2px;}
    .pbar{height:4px;}
    .card{border-radius:16px;padding:8px 10px;}
    .qcard{padding:8px 10px 7px;}
    .qtext{margin-top:4px;line-height:1.38;}
    .opts{gap:5px;margin-top:6px;}
    .opt{padding:7px 9px;font-size:14.5px;line-height:1.3;}
    .opt .mk{flex:0 0 22px;height:22px;font-size:12px;}
    .fb{margin-top:5px;padding:6px 9px;font-size:12.5px;line-height:1.35;}
    .fb b{font-size:13.5px;}
    .next{padding:11px;font-size:15px;border-radius:13px;}
    .emoji{font-size:clamp(24px,6.6vw,30px);}
    .sent{font-size:clamp(18px,5.4vw,24px);}
    .btn{padding:9px 6px;font-size:13.5px;}
    .btn.listen,.btn.slow,.btn.stop{font-size:15px;}
  }
  .next{flex:0 0 auto;background:#1552a8;color:#fff;border:0;border-radius:15px;font-family:inherit;
    font-weight:900;font-size:16px;padding:13px;cursor:pointer;box-shadow:0 4px 14px rgba(21,82,168,.28);}

  /* 결과 */
  .done{align-items:center;justify-content:center;text-align:center;gap:4px;}
  .done .big{font-size:clamp(40px,12vw,54px);line-height:1.1;}
  .done h2{font-size:clamp(19px,5.4vw,23px);font-weight:900;color:#12233d;margin-top:2px;}
  .done .sc{font-size:15px;font-weight:900;color:#1552a8;}
  .done .wr{font-size:13px;font-weight:800;color:#6b7a90;line-height:1.5;word-break:keep-all;}
  .done .row{width:100%;margin-top:8px;}
  .done .btn{flex:1;font-size:15px;}

  /* 소리 안내 */
  .warn{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:70;
    background:#b3261e;color:#fff;font-size:13px;font-weight:800;line-height:1.4;padding:10px 12px;
    border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center;word-break:keep-all;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="co">(주)동양싸이로 · 외국인 근로자</div>
      <h1>매일 생활한국어</h1>
    </div>
  </div>
  <div class="daybar" id="daybar" aria-label="날짜 선택"></div>
  <div class="tabs" role="tablist">
    <button class="tab on" id="tab-read" role="tab" aria-selected="true">📖 4초 따라 읽기</button>
    <button class="tab" id="tab-quiz" role="tab" aria-selected="false">🎮 복습 퀴즈</button>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <main>
    <!-- 4초 따라 읽기 -->
    <section class="panel" id="p-read">
      <div class="card">
        <div class="chip" id="r-chip">공장 생활</div>
        <div class="emoji" id="r-emoji">🪪</div>
        <div class="sent" id="r-sent" role="button" tabindex="0" aria-label="문장을 누르면 들려줍니다"></div>
        <div class="words" id="r-words"></div>
        <div class="when" id="r-when"></div>
        <div class="cd" id="r-cd" aria-live="polite">
          <div class="cd-head">
            <span class="cd-txt">🗣️ 따라 읽어 보세요!</span>
            <span class="cd-num" id="r-cd-num">4</span>
          </div>
          <div class="cd-track"><i id="r-cd-fill"></i></div>
        </div>
        <div class="tip">👆 문장을 눌러도 들려줘요</div>
      </div>
      <div class="row">
        <button class="btn listen" id="btn-listen">🔊 듣기</button>
        <button class="btn slow" id="btn-slow">🐢 천천히</button>
        <button class="btn stop" id="btn-stop" hidden>⏹ 멈춤</button>
      </div>
      <div class="row">
        <button class="btn nav" id="btn-prev">◀ 이전</button>
        <div class="idx"><b id="r-idx">1</b>&nbsp;/&nbsp;10</div>
        <button class="btn nav" id="btn-next">다음 ▶</button>
      </div>
      <div class="row">
        <button class="btn small" id="btn-all">▶ 10문장 전체 듣기</button>
        <button class="btn small" id="btn-list">📋 목록</button>
      </div>
    </section>

    <!-- 복습 퀴즈 -->
    <section class="panel" id="p-quiz" hidden>
      <div class="qbar"><span>문제 <b id="q-no">1</b>/10</span><span>맞은 개수 <b id="q-score">0</b></span></div>
      <div class="card qcard" id="q-card">
        <div class="qtop">
          <span class="qtag" id="q-tag">어휘</span>
          <button class="qsay" id="q-saybox"><span id="q-say">🔊 문제 듣기</span></button>
        </div>
        <div class="qtext" id="q-text"></div>
        <div class="opts" id="q-opts"></div>
        <div class="fb" id="q-fb" hidden></div>
      </div>
      <button class="next" id="q-next" hidden>다음 문제 ▶</button>
      <div class="card done" id="q-done" hidden>
        <div class="big" id="d-emoji">🎉</div>
        <h2 id="d-title">10문제 중 10문제 정답!</h2>
        <div class="sc" id="d-score">100점</div>
        <div class="wr" id="d-wrong"></div>
        <div class="row">
          <button class="btn" id="d-again">🔄 다시 풀기</button>
          <button class="btn" id="d-read">📖 따라 읽기</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-h"><b>1일차 10문장</b><button id="sheet-close">닫기 ✕</button></div>
    <div id="sheet-list"></div>
  </div>
</div>
<div class="warn" id="warn" hidden></div>

  var RATE_NORMAL = 0.80, RATE_SLOW = 0.65;

  var day = DAYS[DAYS.length - 1];          /* 처음에는 가장 최근 날짜 */
  var S = day.sentences, Q = day.quiz;
  var state = {tab:"read", i:0, rate:RATE_NORMAL, seq:false, qi:0, score:0, wrong:[], answered:false};
  var playToken = 0;

  var $ = function(id){ return document.getElementById(id); };

  /* ───────── 날짜/일차 선택 바 ───────── */
  function drawDaybar(){
    var bar = $("daybar"); bar.innerHTML = "";
    DAYS.forEach(function(d){
      var b = document.createElement("button");
      b.className = "daybtn" + (d === day ? " on" : "");
      b.textContent = d.no + "일차 · " + d.label;
      b.onclick = function(){ if (d === day) return; day = d; S = d.sentences; Q = d.quiz; state.i = 0; state.qi = 0;
        drawDaybar(); renderRead(); resetQuiz(); };
      bar.appendChild(b);
    });
    var tip = document.createElement("button");
    tip.className = "daybtn lock"; tip.textContent = "매일 새 날짜가 늘어나요";
    tip.disabled = true;
    bar.appendChild(tip);
  }

  /* ───────── 소리 ───────── */
  var el = null, warnT = 0, synth = window.speechSynthesis || null;
  function warn(msg){
    var w = $("warn"); w.textContent = msg; w.hidden = false;
    clearTimeout(warnT); warnT = setTimeout(function(){ w.hidden = true; }, 6000);
  }
  function stopAll(){
    playToken += 1;
    state.seq = false;
    try{ if (el){ el.pause(); el.currentTime = 0; } }catch(e){}
    try{ if (synth) synth.cancel(); }catch(e){}
    stopCountdown();
    $("btn-stop").hidden = true;
    $("btn-listen").textContent = "🔊 듣기";
    $("btn-slow").textContent = "🐢 천천히";
    $("r-sent").classList.remove("playing");
    $("btn-all").textContent = "▶ 10문장 전체 듣기";
  }
  function speakTTS(text, rate, done){
    if (!synth || typeof SpeechSynthesisUtterance !== "function"){ done && done(false); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = rate; u.pitch = 1; u.volume = 1;
    var v = null, list = [];
    try{ list = synth.getVoices() || []; }catch(e){}
    for (var k = 0; k < list.length; k++){
      if (list[k] && list[k].lang && String(list[k].lang).toLowerCase().indexOf("ko") === 0){ v = list[k]; break; }
    }
    if (v) u.voice = v;
    u.onend = function(){ done && done(true); };
    u.onerror = function(){ done && done(false); };
    try{ synth.speak(u); }catch(e){ done && done(false); }
  }
  /* 한 문장 재생 → 끝나면 cb(). 반드시 손가락으로 누른 처리 안에서 부른다. */
  function play(text, rate, cb){
    var token = ++playToken;
    var src = MP3[text];
    var finished = false;
    function fin(ok){
      if (finished) return; finished = true;
      if (token !== playToken) return;
      cb && cb(ok);
    }
    if (src){
      try{
        if (!el){ el = new Audio(); el.preload = "auto"; }
        el.onended = function(){ fin(true); };
        el.onerror = function(){ fin(false); };
        el.pause();
        el.src = src;
        el.defaultPlaybackRate = 1;
        el.playbackRate = rate;
        try{ el.preservesPitch = true; el.mozPreservesPitch = true; el.webkitPreservesPitch = true; }catch(e){}
        var p = el.play();
        if (p && typeof p.catch === "function"){
          p.catch(function(){ /* 자동재생 차단 → 기기 음성으로 대신 */ 
            if (token !== playToken) return;
            speakTTS(text, rate * 0.95, fin);
          });
        }
        return;
      }catch(e){}
    }
    speakTTS(text, rate, fin);
  }

  /* ───────── 4초 카운트다운 ───────── */
  var cdT = null, cdRaf = null;
  function stopCountdown(){
    clearInterval(cdT); cdT = null;
    if (cdRaf) cancelAnimationFrame(cdRaf), cdRaf = null;
    $("r-cd").classList.remove("on");
    $("r-cd-fill").style.transition = "none";
    $("r-cd-fill").style.width = "100%";
  }
  function countdown(sec, done){
    var token = playToken;
    var num = $("r-cd-num"), fill = $("r-cd-fill");
    $("r-cd").classList.add("on");
    var n = sec;
    num.textContent = n;
    fill.style.transition = "none"; fill.style.width = "100%";
    requestAnimationFrame(function(){
      fill.style.transition = "width 1s linear"; fill.style.width = "0%";
    });
    clearInterval(cdT);
    cdT = setInterval(function(){
      if (token !== playToken){ clearInterval(cdT); return; }
      n -= 1;
      if (n <= 0){
        clearInterval(cdT);
        num.textContent = "0";
        setTimeout(function(){
          if (token !== playToken) return;
          $("r-cd").classList.remove("on");
          done && done();
        }, 220);
        return;
      }
      num.textContent = n;
      fill.style.transition = "none"; fill.style.width = "100%";
      requestAnimationFrame(function(){
        fill.style.transition = "width 1s linear"; fill.style.width = "0%";
      });
    }, 1000);
  }

  /* ───────── 따라 읽기 화면 ───────── */
  function renderRead(){
    var s = S[state.i];
    $("r-chip").textContent = s.cat === "factory" ? "🏭 공장 생활" : "🏠 실생활";
    $("r-chip").className = "chip " + s.cat;
    $("r-emoji").textContent = s.emoji;
    $("r-sent").textContent = s.text;
    var w = $("r-words"); w.innerHTML = "";
    s.words.forEach(function(x){
      var c = document.createElement("span"); c.className = "wchip";
      c.innerHTML = "<b>" + x.w + "</b> " + x.m;
      w.appendChild(c);
    });
    $("r-when").textContent = "📌 " + s.when;
    $("r-idx").textContent = state.i + 1;
    $("pbar").style.width = ((state.i + 1) / S.length * 100) + "%";
    $("btn-prev").disabled = state.i === 0;
    $("btn-next").disabled = state.i === S.length - 1;
  }
  function goRead(idx, doPlay){
    stopAll();
    state.i = Math.max(0, Math.min(S.length - 1, idx));
    renderRead();
    if (doPlay) playOne(state.rate);
  }
  function playOne(rate){
    stopAll();
    var s = S[state.i];
    state.rate = rate;
    $("r-sent").classList.add("playing");
    $("btn-listen").classList.add("on");
    $("btn-stop").hidden = false;
    play(s.text, rate, function(ok){
      $("r-sent").classList.remove("playing");
      $("btn-stop").hidden = true;
      if (!ok){ warn("소리가 나오지 않으면 크롬·삼성 인터넷으로 열어 주세요."); return; }
      countdown(4, null);
    });
  }
  function playAll(rate){
    stopAll();
    state.seq = true; state.rate = rate;
    $("btn-stop").hidden = false;
    $("btn-all").textContent = "⏸ 그만 듣기";
    var i = state.i;
    function step(){
      if (!state.seq) return;
      state.i = i; renderRead();
      $("r-sent").classList.add("playing");
      var s = S[i];
      play(s.text, rate, function(ok){
        $("r-sent").classList.remove("playing");
        if (!ok){ state.seq = false; warn("소리가 나오지 않으면 크롬·삼성 인터넷으로 열어 주세요."); return; }
        countdown(4, function(){
          if (!state.seq) return;
          if (i < S.length - 1){ i += 1; step(); }
          else { state.seq = false; $("btn-stop").hidden = true; $("btn-all").textContent = "▶ 10문장 전체 듣기"; }
        });
      });
    }
    step();
  }

  $("btn-listen").onclick = function(){ playOne(RATE_NORMAL); };
  $("btn-slow").onclick = function(){ playOne(RATE_SLOW); };
  $("btn-stop").onclick = function(){ stopAll(); };
  $("btn-all").onclick = function(){ if (state.seq){ stopAll(); } else { playAll(state.rate); } };
  $("r-sent").onclick = function(){ playOne(state.rate); };
  $("btn-prev").onclick = function(){ goRead(state.i - 1, false); };
  $("btn-next").onclick = function(){ goRead(state.i + 1, false); };
  $("btn-list").onclick = function(){ openSheet(); };

  /* ───────── 목록 ───────── */
  function openSheet(){
    var box = $("sheet-list"); box.innerHTML = "";
    S.forEach(function(s, i){
      var row = document.createElement("div"); row.className = "item";
      row.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t">' + s.text + '</span>' +
        '<span class="c ' + s.cat + '">' + (s.cat === "factory" ? "공장" : "생활") + '</span>';
      row.onclick = function(){ $("sheet").hidden = true; goRead(i, true); };
      box.appendChild(row);
    });
    $("sheet").hidden = false;
  }
  $("sheet-close").onclick = function(){ $("sheet").hidden = true; };
  $("sheet").onclick = function(e){ if (e.target === $("sheet")) $("sheet").hidden = true; };

  /* ───────── 탭 ───────── */
  function setTab(t){
    stopAll(); state.tab = t;
    $("tab-read").classList.toggle("on", t === "read");
    $("tab-quiz").classList.toggle("on", t === "quiz");
    $("tab-read").setAttribute("aria-selected", t === "read");
    $("tab-quiz").setAttribute("aria-selected", t === "quiz");
    $("p-read").hidden = t !== "read";
    $("p-quiz").hidden = t !== "quiz";
  }
  $("tab-read").onclick = function(){ setTab("read"); renderRead(); };
  $("tab-quiz").onclick = function(){ setTab("quiz"); resetQuiz(); };

  /* ───────── 퀴즈 ───────── */
  var MK = ["①", "②", "③", "④", "⑤"];
  function resetQuiz(){
    state.qi = 0; state.score = 0; state.wrong = []; state.answered = false;
    $("q-done").hidden = true; $("q-card").hidden = false; $("q-next").hidden = true;
    renderQuiz();
  }
  function renderQuiz(){
    state.answered = false;
    var q = Q[state.qi];
    $("q-no").textContent = state.qi + 1;
    $("q-score").textContent = state.score;
    $("q-tag").textContent = q.tag;
    $("q-text").textContent = q.q;
    $("q-saybox").hidden = !q.say;
    $("q-card").classList.remove("answered");
    $("q-fb").hidden = true;
    $("q-next").hidden = true;
    $("q-next").textContent = (state.qi === Q.length - 1) ? "결과 보기 ▶" : "다음 문제 ▶";
    var box = $("q-opts"); box.innerHTML = "";
    q.options.forEach(function(t, i){
      var b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = '<span class="mk">' + MK[i] + '</span><span>' + t + '</span>';
      b.onclick = function(){ answer(i, b); };
      box.appendChild(b);
    });
    $("pbar").style.width = ((state.qi) / Q.length * 100) + "%";
  }
  function answer(i, btn){
    if (state.answered) return;
    state.answered = true;
    $("q-card").classList.add("answered");
    var q = Q[state.qi];
    var ok = i === q.answer;
    if (ok) state.score += 1; else state.wrong.push(state.qi + 1);
    $("q-score").textContent = state.score;
    var opts = $("q-opts").children;
    for (var k = 0; k < opts.length; k++){
      opts[k].disabled = true;
      if (k === q.answer) opts[k].classList.add("correct");
      else if (k === i) opts[k].classList.add("wrong");
      else opts[k].classList.add("dim");
    }
    var fb = $("q-fb");
    fb.className = "fb " + (ok ? "ok" : "no");
    fb.innerHTML = "<b>" + (ok ? "⭕ 맞았어요!" : "❌ 아쉬워요. 정답은 " + MK[q.answer] + " " + q.options[q.answer]) + "</b>" + q.explain;
    fb.hidden = false;
    $("q-next").hidden = false;
  }
  $("q-saybox").onclick = function(){ var q = Q[state.qi]; if (q.say) play(q.say, state.rate, null); };
  $("q-next").onclick = function(){
    if (state.qi < Q.length - 1){ state.qi += 1; renderQuiz(); }
    else { showDone(); }
  };
  function showDone(){
    var n = Q.length, s = state.score;
    $("q-card").hidden = true; $("q-next").hidden = true; $("q-done").hidden = false;
    $("d-emoji").textContent = s === n ? "🏆" : (s >= 7 ? "🎉" : "💪");
    $("d-title").textContent = n + "문제 중 " + s + "문제 정답!";
    $("d-score").textContent = Math.round(s / n * 100) + "점";
    $("d-wrong").textContent = state.wrong.length ?
      ("틀린 문제: " + state.wrong.join(", ") + "번 — 따라 읽기에서 다시 들어 보세요.") : "모두 맞았어요. 내일도 이어서 공부해요!";
    $("pbar").style.width = "100%";
  }
  $("d-again").onclick = function(){ resetQuiz(); };
  $("d-read").onclick = function(){ setTab("read"); goRead(0, false); };

  /* ───────── 시작 ───────── */
  drawDaybar();
  renderRead();
  window.addEventListener("pagehide", stopAll);
})();
</script>
</body>
</html>
