<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e6fd9">
<meta name="color-scheme" content="light">
<title>한글 1강 · 모음과 자음 따라 읽기</title>
<style>
  :root{color-scheme:light;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic",system-ui,sans-serif;
    background:#eef3fa;color:#1f2430;line-height:1.4;overflow:hidden;
    word-break:keep-all;
  }
  .app{
    max-width:520px;margin:0 auto;height:100vh;height:100dvh;
    display:flex;flex-direction:column;gap:6px;
    padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }

  /* ── 상단 ── */
  .bar{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .pcount{
    font-size:14.5px;font-weight:800;color:#1552a8;background:#fff;
    border-radius:99px;padding:7px 12px;white-space:nowrap;
    box-shadow:0 2px 8px rgba(20,40,80,.08);font-variant-numeric:tabular-nums;
  }
  .tabs{display:flex;gap:5px;flex:1;background:#fff;border-radius:99px;padding:4px;box-shadow:0 2px 8px rgba(20,40,80,.08);}
  .tab{
    flex:1;border:0;background:transparent;font-family:inherit;
    font-size:13.5px;font-weight:800;color:#5a6474;padding:8px 2px;border-radius:99px;
    cursor:pointer;white-space:nowrap;line-height:1.25;
  }
  .tab.on{background:#1e6fd9;color:#fff;}
  .pbar{flex:0 0 auto;height:5px;background:#dbe5f2;border-radius:99px;overflow:hidden;}
  .pbar i{display:block;height:100%;width:0;background:#2e9e5b;border-radius:99px;transition:width .3s ease;}

  .sound-banner{
    position:fixed;left:0;right:0;top:0;z-index:50;
    background:#c62828;color:#fff;font-size:13.5px;font-weight:800;line-height:1.6;
    padding:11px 14px calc(11px + env(safe-area-inset-top));
    box-shadow:0 4px 14px rgba(0,0,0,.25);text-align:center;
  }

  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;}

  /* ── 카드 ── */
  .card{
    flex:1 1 auto;min-height:0;
    background:#fff;border-radius:20px;padding:10px 14px 11px;
    box-shadow:0 6px 20px rgba(20,40,80,.10);
    display:flex;flex-direction:column;align-items:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .chip{
    font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:99px;align-self:flex-start;
    background:#e6f0ff;color:#1552a8;line-height:1.4;white-space:nowrap;
  }
  .chip.vowel{background:#fff0e0;color:#b45a00;}
  .chip.cons{background:#e7f7ec;color:#1b7a3d;}
  .chip.syl{background:#e6f0ff;color:#1552a8;}
  .chip.start{background:#1e6fd9;color:#fff;}

  .bodywrap{
    flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;
  }
  .glyphwrap{
    flex:0 0 auto;width:100%;
    display:flex;align-items:center;justify-content:center;padding:1px 0;
  }
  .glyph{
    font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:clamp(84px,26vh,200px);line-height:1.08;font-weight:800;color:#12233d;
    text-align:center;transition:color .15s;
  }
  .glyph.on{color:#1552a8;}

  /* 큰 글자 밑 단일 배지 — 모음=소리, 자음=이름, 글자=조합식 */
  .hint{display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin:2px 0 7px;width:100%;}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    background:#e8f2ff;border:1.5px solid #cfe3fb;border-radius:99px;
    padding:5px 18px;color:#1552a8;
    font-size:21px;font-weight:800;line-height:1.35;letter-spacing:.5px;
    white-space:nowrap;
  }

  .mean{
    flex:0 0 auto;
    width:100%;font-size:15.5px;font-weight:700;color:#33435c;line-height:1.75;
    background:#f1f6ff;border-radius:12px;padding:8px 11px;text-align:center;
    overflow-wrap:anywhere;text-wrap:balance;
  }

  /* ── 인트로 ── */
  .intro{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:2px 2px 4px;}
  .intro .kicker{font-size:14px;font-weight:800;color:#2e9e5b;letter-spacing:1px;}
  .intro h1{font-size:min(6.4vh,28px);font-weight:800;color:#12233d;line-height:1.35;margin:2px 0 6px;}
  .intro .phrase{
    font-size:min(5.6vh,24px);font-weight:800;color:#0f3f82;line-height:1.5;
    background:#fff7cf;border:2px solid #ffd93d;border-radius:16px;padding:10px 12px;
    box-shadow:0 4px 14px rgba(255,190,0,.22);
  }
  .intro .tip{font-size:13.5px;font-weight:800;color:#5a6474;line-height:1.6;margin-top:8px;}

  /* ── 따라 읽기 바 ── */
  .readbar{
    position:relative;width:100%;height:36px;flex:0 0 auto;
    display:flex;align-items:center;gap:7px;overflow:hidden;
    padding:0 11px 3px;border-radius:11px;margin:7px 0 0;
    background:#eef4fd;color:#4d6a92;
    font-size:13px;font-weight:800;line-height:1.4;
    transition:background .15s,color .15s,box-shadow .15s;
  }
  .readbar .rb-ico{flex:0 0 auto;font-size:15px;line-height:1;}
  .readbar .rb-txt{flex:1 1 auto;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .readbar .rb-num{
    flex:0 0 auto;min-width:27px;height:23px;text-align:center;
    font-size:16px;font-weight:800;line-height:23px;border-radius:99px;
    background:#ffd93d;color:#6b3d00;
  }
  .readbar.on{background:#e4efff;color:#1552a8;box-shadow:inset 0 0 0 2px #b9d4f7;}
  .readbar.cd{background:#fff7cf;color:#8a5000;box-shadow:inset 0 0 0 2px #ffd93d;}
  .readbar.done{background:#e7f7ec;color:#1b7a3d;box-shadow:inset 0 0 0 2px #b9e3c7;}
  .readbar.warn{background:#ffe9e9;color:#a11b1b;box-shadow:inset 0 0 0 2px #ffc0c0;}
  .readbar .rb-fill{
    position:absolute;left:0;bottom:0;height:3px;width:0;
    background:#2e9e5b;border-radius:0 3px 3px 0;transition:width .95s linear;
  }
  .readbar.cd .rb-fill{background:#f2a100;}

  .snd-row{display:flex;gap:8px;width:100%;margin-top:8px;flex:0 0 auto;}
  .snd{
    flex:1;border:0;border-radius:14px;font-family:inherit;font-size:17px;font-weight:800;
    padding:13px 4px;cursor:pointer;background:#1e6fd9;color:#fff;line-height:1.3;
    box-shadow:0 3px 10px rgba(30,111,217,.28);
  }
  .snd.slow{background:#fff3e3;color:#a35600;border:1.5px solid #ffd8a8;box-shadow:none;}
  .snd:active{transform:translateY(1px);}
  .snd.playing{background:#1552a8;}

  /* ── 아래 버튼 ── */
  .nav{display:flex;gap:8px;flex:0 0 auto;min-height:52px;}
  .nav button{
    flex:1;font-family:inherit;font-size:16px;font-weight:800;padding:14px 4px;border-radius:14px;min-height:52px;
    border:1.5px solid #cfdcf0;background:#fff;color:#2c3d55;cursor:pointer;white-space:nowrap;
  }
  .nav button:disabled{opacity:.35;}
  .nav .go{flex:1.3;background:#1e6fd9;border:0;color:#fff;box-shadow:0 3px 10px rgba(30,111,217,.28);}
  .nav .go.again{background:#2e9e5b;box-shadow:0 3px 10px rgba(46,158,91,.30);}

  /* ── 퀴즈 ── */
  #quizCard{flex:0 0 auto;margin:auto 0;}
  .qtop{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:6px;gap:8px;}
  .qtype{font-size:12px;font-weight:800;color:#b45a00;background:#fff0e0;padding:4px 10px;border-radius:99px;line-height:1.4;}
  .qscore{font-size:12.5px;font-weight:800;color:#1552a8;background:#e6f0ff;padding:4px 10px;border-radius:99px;line-height:1.4;white-space:nowrap;}
  .qprompt{font-size:14.5px;font-weight:800;color:#1552a8;margin:8px 0 7px;text-align:center;line-height:1.55;}
  .opts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(104px,auto));gap:10px;width:100%;flex:0 0 auto;margin-top:4px;}
  .opt{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:2px solid #e2e9f3;background:#fff;border-radius:16px;padding:10px 4px;min-height:104px;
    font-family:inherit;cursor:pointer;
  }
  .opt .mark{font-size:11.5px;font-weight:800;color:#8a95a6;line-height:1.2;}
  .opt .g{
    font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
    font-size:clamp(38px,12vw,54px);line-height:1.15;font-weight:800;color:#12233d;
  }
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:#2e9e5b;background:#eaf8ef;}
  .opt.correct .g{color:#1b7a3d;}
  .opt.wrong{border-color:#d64545;background:#fdeeee;}
  .opt.wrong .g{color:#b12b2b;}
  .opt.dim{opacity:.45;}
  .fb{
    width:100%;margin-top:8px;border-radius:10px;padding:7px 10px;
    font-size:13.5px;font-weight:800;line-height:1.7;text-align:center;
  }
  .fb.ok{background:#eaf8ef;color:#1b7a3d;border:1px solid #b9e3c7;}
  .fb.no{background:#fdeeee;color:#b12b2b;border:1px solid #f2c1c1;}

  /* ── 결과 ── */
  .result{justify-content:center;text-align:center;gap:2px;}
  .result .bigscore{font-size:38px;font-weight:800;color:#1e6fd9;line-height:1.1;margin:6px 0 2px;}
  .result .bigscore small{font-size:17px;color:#7b8798;font-weight:800;}
  .result .rtitle{font-size:18px;font-weight:800;color:#12233d;margin:4px 0 6px;line-height:1.5;}
  .wrongbox{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:2px;}
  .wronggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;width:100%;margin-top:2px;}
  .wgitem{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:0;border-radius:13px;background:#fdeeee;color:#8e2626;font-family:inherit;
    padding:8px 3px 7px;cursor:pointer;min-height:74px;
  }
  .wgitem .g{font-size:30px;font-weight:800;color:#8e2626;line-height:1.2;}
  .wgitem .t{font-size:11.5px;font-weight:800;color:#8e2626;line-height:1.3;text-align:center;}
  .wgitem .i{font-size:12px;font-weight:800;color:#b96a6a;line-height:1.2;}

  @media (max-height:700px){
    .glyph{font-size:clamp(92px,27vh,180px);}
    .badge{font-size:19px;padding:4px 15px;}
    .mean{font-size:14.5px;line-height:1.6;}
    .snd,.nav button{padding:11px 4px;font-size:15.5px;}
    .readbar{height:32px;}
  }
  @media (max-height:600px){
    .glyph{font-size:clamp(84px,25vh,150px);}
    .chip{font-size:11.5px;padding:3px 9px;}
    .badge{font-size:17.5px;padding:3px 13px;}
    .hint{margin:2px 0 5px;}
    .mean{font-size:13.5px;line-height:1.55;padding:6px 9px;}
    .opt{padding:6px 3px;min-height:88px;}
    .opt .g{font-size:34px;}
    .snd,.nav button{padding:10px 4px;font-size:15px;}
    .readbar{height:30px;margin-top:6px;}
    .snd-row{margin-top:6px;}
  }
  @media (max-height:540px){
    .glyph{font-size:clamp(72px,22vh,130px);}
  }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <span class="pcount" id="cardCount">1 / 32</span>
    <nav class="tabs" role="tablist">
      <button class="tab on" id="tabBtnLearn" role="tab" aria-selected="true">📖 배우기</button>
      <button class="tab" id="tabBtnQuiz" role="tab" aria-selected="false">🎮 듣기 퀴즈</button>
    </nav>
  </header>
  <div class="pbar"><i id="progressFill"></i></div>

  <main>
    <!-- ══════════ 배우기 ══════════ -->
    <section class="panel" id="panelLearn" role="tabpanel">
      <article class="card" id="cardBox">
        <span class="chip" id="cardChip">모음</span>

        <div class="intro" id="introBox" hidden>
          <p class="kicker">한글 1강</p>
          <h1>모음과 자음을<br>소리 내어 읽어 봅시다</h1>
          <p class="phrase">지금부터 천천히<br>따라서 연습해 봅시다!</p>
          <p class="tip">🔊 <b>듣기</b> 버튼을 누르면 소리가 나옵니다.<br>다음 카드부터는 4초 동안 따라 읽어 보세요.</p>
        </div>

        <div class="bodywrap" id="bodyWrap">
          <div class="glyphwrap" id="glyphWrap">
            <div class="glyph" id="cardGlyph">ㅏ</div>
          </div>
          <div class="hint" id="cardHint"></div>
          <p class="mean" id="cardMean"></p>
        </div>

        <div class="readbar" id="readBar">
          <span class="rb-ico" id="readBarIco">👆</span>
          <span class="rb-txt" id="readBarTxt">글자를 눌러 소리를 들어 보세요</span>
          <span class="rb-num" id="readBarNum" hidden>4</span>
          <i class="rb-fill" id="readBarFill"></i>
        </div>
        <div class="snd-row">
          <button class="snd" id="btnSpeak" type="button">🔊 듣기</button>
          <button class="snd slow" id="btnSlow" type="button">🐢 천천히</button>
        </div>
      </article>
      <nav class="nav">
        <button id="btnPrev" type="button">◀ 이전</button>
        <button class="go" id="btnNext" type="button">다음 ▶</button>
      </nav>
    </section>

    <!-- ══════════ 퀴즈 ══════════ -->
    <section class="panel" id="panelQuiz" role="tabpanel" hidden>
      <article class="card" id="quizCard">
        <div class="qtop">
          <span class="qtype">🎧 듣고 고르기</span>
          <span class="qscore" id="quizScore">점수 0</span>
        </div>
        <div class="snd-row" style="margin-top:2px;">
          <button class="snd" id="btnQuizReplay" type="button">🔊 다시 듣기</button>
          <button class="snd slow" id="btnQuizSlow" type="button">🐢 천천히</button>
        </div>
        <p class="qprompt">들려주는 소리를 듣고<br>알맞은 글자를 고르세요</p>
        <div class="opts" id="qOptions"></div>
        <p class="fb" id="qFeedback" hidden></p>
      </article>
      <nav class="nav">
        <button class="go" id="btnQuizNext" type="button" disabled>다음 문제 ▶</button>
      </nav>
    </section>

    <!-- ══════════ 결과 ══════════ -->
    <section class="panel" id="panelResult" hidden>
      <article class="card result">
        <div class="bigscore"><span id="resultScore">0</span><small> / 10</small></div>
        <h2 class="rtitle" id="resultTitle"></h2>
        <div class="wrongbox" id="wrongBox"></div>
      </article>
      <nav class="nav">
        <button id="btnQuizAgain" type="button">🔄 다시 풀기</button>
        <button class="go" id="btnGoLearn" type="button">📖 배우기</button>
      </nav>
    </section>
  </main>
</div>

<div class="sound-banner" id="soundBanner" hidden></div>

<script>
(function () {
  "use strict";

  /* ───────────── 카드 데이터 ───────────── */

    } catch (e) { speakFallback(item, rate, c); return; }

    var p = null;
    try { p = a.play(); } catch (e) { speakFallback(item, rate, c); return; }

    if (p && typeof p.then === "function") {
      p.then(function () {
        if (tok === playToken && c.onStart) { c.onStart(); }
      }).catch(function (err) {
        if (tok !== playToken) { return; }
        if (err && (err.name === "NotAllowedError" || err.name === "AbortError")) {
          if (err.name === "NotAllowedError") {
            barWarn("🔊 버튼을 한 번 눌러 주세요");
          }
          return;
        }
        speakFallback(item, rate, c);
      });
    } else if (c.onStart) {
      c.onStart();
    }
  }

  /* ───────────── 화면 요소 ───────────── */
  var elBanner = document.getElementById("soundBanner");
  var elCardCount = document.getElementById("cardCount");
  var elProgressFill = document.getElementById("progressFill");
  var elPanelLearn = document.getElementById("panelLearn");
  var elPanelQuiz = document.getElementById("panelQuiz");
  var elPanelResult = document.getElementById("panelResult");
  var tabLearn = document.getElementById("tabBtnLearn");
  var tabQuiz = document.getElementById("tabBtnQuiz");

  var elCardBox = document.getElementById("cardBox");
  var elChip = document.getElementById("cardChip");
  var elIntro = document.getElementById("introBox");
  var elBody = document.getElementById("bodyWrap");
  var elGlyphWrap = document.getElementById("glyphWrap");
  var elGlyph = document.getElementById("cardGlyph");
  var elHint = document.getElementById("cardHint");
  var elMean = document.getElementById("cardMean");
  var elSpeak = document.getElementById("btnSpeak");
  var elSlow = document.getElementById("btnSlow");
  var elPrev = document.getElementById("btnPrev");
  var elNext = document.getElementById("btnNext");

  var elReadBar = document.getElementById("readBar");
  var elReadIco = document.getElementById("readBarIco");
  var elReadTxt = document.getElementById("readBarTxt");
  var elReadNum = document.getElementById("readBarNum");
  var elReadFill = document.getElementById("readBarFill");

  function barIdle() {
    elReadBar.className = "readbar";
    elReadIco.textContent = "👆";
    elReadTxt.textContent = "글자를 눌러 소리를 들어 보세요";
    elReadNum.hidden = true;
    elReadFill.style.transition = "width .2s linear";
    elReadFill.style.width = "0%";
  }
  function barListening() {
    elReadBar.className = "readbar on";
    elReadIco.textContent = "🔊";
    elReadTxt.textContent = "듣고 있어요";
    elReadNum.hidden = true;
    elReadFill.style.transition = "width .2s linear";
    elReadFill.style.width = "0%";
  }
  function barFollowStart() {
    elReadFill.style.transition = "none";
    elReadFill.style.width = "100%";
    void elReadFill.offsetWidth;
    elReadFill.style.transition = "width .95s linear";
  }
  function barFollow(left) {
    elReadBar.className = "readbar cd";
    elReadIco.textContent = "🗣️";
    elReadTxt.textContent = "따라 읽어 보세요";
    elReadNum.hidden = false;
    elReadNum.textContent = String(left);
    elReadFill.style.width = (left / FOLLOW_SECONDS * 100) + "%";
  }
  function barDone() {
    elReadBar.className = "readbar done";
    elReadIco.textContent = "👏";
    elReadTxt.textContent = "잘했어요!";
    elReadNum.hidden = true;
    elReadFill.style.transition = "width .2s linear";
    elReadFill.style.width = "0%";
    if (doneTimer) { window.clearTimeout(doneTimer); }
    doneTimer = window.setTimeout(function () { doneTimer = null; barIdle(); }, 3500);
  }
  function barWarn(msg) {
    elReadBar.className = "readbar warn";
    elReadIco.textContent = "🔇";
    elReadTxt.textContent = msg;
    elReadNum.hidden = true;
    elReadFill.style.transition = "width .2s linear";
    elReadFill.style.width = "0%";
  }

  function highlight(on) {
    elGlyph.classList.toggle("on", !!on);
    elSpeak.classList.toggle("playing", !!on);
  }

  function elQuizCardOn(on) {
    var q = document.getElementById("quizCard");
    if (q) { q.classList.toggle("playing", !!on); }
  }

  /* ───────────── 따라 읽기 ───────────── */
  function speakCard(rate) {
    var it = ITEMS[state.index];
    if (!it) { return; }
    barListening();
    playItem(it, rate, {
      onStart: function () { barListening(); highlight(true); },
      onEnd: function () { highlight(false); startFollow(it); }
    });
  }

  function startFollow(it) {
    if (it.kind === "intro") { barDone(); return; }
    var left = FOLLOW_SECONDS;
    if (seqTimer) { window.clearInterval(seqTimer); }
    barFollowStart();
    barFollow(left);
    seqTimer = window.setInterval(function () {
      left -= 1;
      if (left > 0) { barFollow(left); return; }
      window.clearInterval(seqTimer);
      seqTimer = null;
      elReadFill.style.transition = "width .2s linear";
      elReadFill.style.width = "0%";
      barDone();
    }, 1000);
  }

  /* ───────────── 카드 그리기 ───────────── */
  function renderCard() {
    var i = state.index;
    var it = ITEMS[i];
    var isIntro = (it.kind === "intro");

    elCardCount.textContent = (i + 1) + " / " + TOTAL;
    elProgressFill.style.width = ((i + 1) / TOTAL * 100) + "%";

    elChip.textContent = isIntro ? "시작" : it.chip;
    elChip.className = "chip " + (isIntro ? "start" : it.kind);

    elIntro.hidden = !isIntro;
    elBody.hidden = isIntro;
    elReadBar.hidden = isIntro;
    elCardBox.classList.toggle("has-intro", isIntro);

    if (!isIntro) {
      elGlyph.textContent = it.glyph;
      elGlyph.classList.remove("on");

      var bt = badgeText(it);
      elHint.textContent = "";
      if (bt) {
        var bd = document.createElement("span");
        bd.className = "badge";
        bd.textContent = bt;
        bd.setAttribute("aria-label", badgeAria(it));
        elHint.appendChild(bd);
      }
      elHint.hidden = !bt;

      elMean.textContent = it.note;
    }

    elPrev.disabled = (i === 0);
    var last = (i === TOTAL - 1);
    elNext.disabled = false;
    elNext.textContent = isIntro ? "시작하기 ▶" : (last ? "🔄 처음부터" : "다음 ▶");
    elNext.classList.toggle("again", last && !isIntro);

    barIdle();
    fitGlyph();
  }

  /* 큰 글자 크기를 남은 세로 공간에 맞춘다.
     주소창이 내려앉아 보이는 높이가 줄어도 설명 박스가 가려지지 않고,
     화면이 큰 기기에서는 글자를 최대한 크게 보여 준다. */
  function fitGlyph() {
    var it = ITEMS[state.index];
    if (!it || it.kind === "intro") { elGlyph.style.fontSize = ""; return; }
    elGlyph.style.fontSize = "";
    var bwH = elBody.clientHeight;
    if (!bwH) { return; }

    var hs = window.getComputedStyle(elHint);
    var rest = 2 /* glyphwrap padding */
      + parseFloat(hs.marginTop || 0) + elHint.offsetHeight + parseFloat(hs.marginBottom || 0)
      + elMean.offsetHeight;
    var gap = parseFloat(window.getComputedStyle(elBody).rowGap || 0);
    if (isNaN(gap)) { gap = 0; }
    rest += gap * 2;

    var gr = elGlyph.getBoundingClientRect();
    var fs = parseFloat(window.getComputedStyle(elGlyph).fontSize);
    if (!gr.height || !fs) { return; }

    var byH = fs * ((bwH - rest - 4) / gr.height);          /* 세로 */
    var cardInner = elCardBox.clientWidth
      - parseFloat(window.getComputedStyle(elCardBox).paddingLeft || 0)
      - parseFloat(window.getComputedStyle(elCardBox).paddingRight || 0);
    var byW = gr.width ? fs * ((cardInner - 8) / gr.width) : byH;   /* 가로 */

    var target = Math.floor(Math.min(byH, byW, 240));
    if (target < 72) { target = 72; }
    elGlyph.style.fontSize = target + "px";
  }

  window.addEventListener("resize", fitGlyph);
  window.addEventListener("orientationchange", function () { window.setTimeout(fitGlyph, 300); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitGlyph);
  }
  try { if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitGlyph); } } catch (e) {}

  /* 큰 글자 밑 배지는 늘 하나 — 모음은 소리, 자음은 정식 이름, 글자는 자모 조합식 */
  function badgeText(it) {
    if (it.kind === "syl") { return it.formula || ""; }
    if (it.kind === "cons") { return it.name || it.snd || ""; }
    return it.snd || it.name || "";
  }

  function badgeAria(it) {
    if (it.kind === "syl") { return it.glyph + " — " + (it.formula || ""); }
    if (it.kind === "cons") { return "이름 " + (it.name || it.snd || ""); }
    return "소리 " + (it.snd || it.name || "");
  }
  function goTo(i) {
    stopAll();
    elCardBox.scrollTop = 0;
    state.index = Math.max(0, Math.min(TOTAL - 1, i));
    renderCard();
  }

  elGlyph.addEventListener("click", function () { speakCard(RATE_NORMAL); });
  elSpeak.addEventListener("click", function () { speakCard(RATE_NORMAL); });
  elSlow.addEventListener("click", function () { speakCard(RATE_SLOW); });
  elPrev.addEventListener("click", function () { goTo(state.index - 1); });
  elNext.addEventListener("click", function () {
    if (state.index >= TOTAL - 1) { goTo(0); return; }   /* 마지막 카드 → 처음부터 */
    goTo(state.index + 1);
  });

  /* 손가락으로 넘기기 */
  var touchX = null, touchY = null;
  elCardBox.addEventListener("touchstart", function (e) {
    if (!e.touches || e.touches.length !== 1) { return; }
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  elCardBox.addEventListener("touchend", function (e) {
    if (touchX === null || !e.changedTouches || !e.changedTouches.length) { return; }
    var t = e.changedTouches[0];
    var dx = t.clientX - touchX;
    var dy = t.clientY - touchY;
    touchX = null; touchY = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      goTo(state.index + (dx < 0 ? 1 : -1));
    }
  }, { passive: true });

  /* ───────────── 퀴즈 ───────────── */
  var QUIZ_N = 10;
  var quiz = { on: false, idx: 0, score: 0, qs: [], answered: false, wrong: [] };

  var elQOptions = document.getElementById("qOptions");
  var elQFeedback = document.getElementById("qFeedback");
  var elQScore = document.getElementById("quizScore");
  var elQuizNext = document.getElementById("btnQuizNext");
  var elResultScore = document.getElementById("resultScore");
  var elResultTitle = document.getElementById("resultTitle");
  var elWrongBox = document.getElementById("wrongBox");

  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  var ALL = [];
  for (var ci = 0; ci < CARDS.length; ci++) { ALL.push(ci + 1); }   /* ITEMS 색인(인트로 제외) */

  function buildQuiz() {
    var picked = shuffle(ALL).slice(0, Math.min(QUIZ_N, ALL.length));
    return picked.map(function (ci, k) {
      var it = ITEMS[ci];
      var sameCat = [];
      for (var p = 0; p < ALL.length; p++) {
        var oi = ALL[p];
        if (oi !== ci && ITEMS[oi].kind === it.kind) { sameCat.push(oi); }
      }
      var opts = [ci];
      var pool = shuffle(sameCat);
      for (var a = 0; a < pool.length && opts.length < 4; a++) { opts.push(pool[a]); }
      if (opts.length < 4) {
        var rest = shuffle(ALL.filter(function (x) { return opts.indexOf(x) === -1; }));
        for (var b = 0; b < rest.length && opts.length < 4; b++) { opts.push(rest[b]); }
      }
      opts = shuffle(opts);
      var want = k % 4;
      var cur = opts.indexOf(ci);
      var tmp = opts[want]; opts[want] = ci; opts[cur] = tmp;
      return { card: ci, opts: opts, correct: want };
    });
  }

  function speakQuiz(rate) {
    if (!quiz.qs.length) { return; }
    var q = quiz.qs[quiz.idx];
    if (!q) { return; }
    playItem(ITEMS[q.card], rate, {
      onStart: function () { elQuizCardOn(true); },
      onEnd: function () { elQuizCardOn(false); }
    });
  }

  function renderQuestion() {
    var q = quiz.qs[quiz.idx];
    quiz.answered = false;

    elCardCount.textContent = (quiz.idx + 1) + " / " + quiz.qs.length;
    elProgressFill.style.width = ((quiz.idx + 1) / quiz.qs.length * 100) + "%";
    elQScore.textContent = "점수 " + quiz.score;
    elQFeedback.hidden = true;
    elQFeedback.className = "fb";
    elQFeedback.textContent = "";
    elQuizNext.disabled = true;
    elQuizNext.textContent = (quiz.idx === quiz.qs.length - 1) ? "결과 보기 🏁" : "다음 문제 ▶";

    elQOptions.textContent = "";
    var marks = ["①", "②", "③", "④"];
    for (var pos = 0; pos < q.opts.length; pos++) {
      var oi = q.opts[pos];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt";
      btn.setAttribute("data-pos", String(pos));

      var mk = document.createElement("span");
      mk.className = "mark";
      mk.textContent = marks[pos];

      var g = document.createElement("span");
      g.className = "g";
      g.textContent = ITEMS[oi].glyph;

      btn.appendChild(mk);
      btn.appendChild(g);
      (function (p) { btn.addEventListener("click", function () { answer(p); }); })(pos);
      elQOptions.appendChild(btn);
    }

    speakQuiz(RATE_NORMAL);
    try { document.getElementById("quizCard").scrollTop = 0; } catch (e) {}
  }

  function startQuiz() {
    quiz = { on: true, idx: 0, score: 0, qs: buildQuiz(), answered: false, wrong: [] };
    elPanelLearn.hidden = true;
    elPanelQuiz.hidden = false;
    elPanelResult.hidden = true;
    renderQuestion();
  }

  function labelOf(it) {
    if (!it) { return ""; }
    return it.glyph + (it.name ? " (" + it.name + ")" : "");
  }

  function answer(pos) {
    if (quiz.answered) { return; }
    quiz.answered = true;
    stopAll();

    var q = quiz.qs[quiz.idx];
    var it = ITEMS[q.card];
    var ok = (pos === q.correct);

    var btns = elQOptions.querySelectorAll(".opt");
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      b.disabled = true;
      var p = Number(b.getAttribute("data-pos"));
      if (p === q.correct) { b.className = "opt correct"; }
      else if (p === pos) { b.className = "opt wrong"; }
      else { b.className = "opt dim"; }
    }

    if (ok) { quiz.score += 1; } else { quiz.wrong.push(q.card); }
    elQScore.textContent = "점수 " + quiz.score;

    elQFeedback.hidden = false;
    if (ok) {
      elQFeedback.className = "fb ok";
      elQFeedback.textContent = "맞았어요! 잘했어요";
    } else {
      elQFeedback.className = "fb no";
      elQFeedback.textContent = "정답은 " + labelOf(it) + " 예요";
    }
    elQuizNext.disabled = false;
  }

  elQuizNext.addEventListener("click", function () {
    if (quiz.idx >= quiz.qs.length - 1) { showResult(); return; }
    quiz.idx += 1;
    renderQuestion();
  });

  function showResult() {
    quiz.on = false;
    stopAll();

    var n = quiz.score;
    var totalQ = quiz.qs.length;
    elResultScore.textContent = String(n);
    elResultTitle.textContent = "";

    if (n === totalQ) { elResultTitle.textContent = "완벽해요! 모두 맞혔습니다"; }
    else if (n >= totalQ * 0.6) { elResultTitle.textContent = "잘했어요! 조금만 더 들으면 돼요"; }
    else if (n >= totalQ * 0.4) { elResultTitle.textContent = "좋아요! 한 번 더 들어 볼까요?"; }
    else { elResultTitle.textContent = "괜찮아요! 다시 들으면서 해 봐요"; }

    elWrongBox.textContent = "";
    var uniq = [];
    for (var i = 0; i < quiz.wrong.length; i++) {
      if (uniq.indexOf(quiz.wrong[i]) === -1) { uniq.push(quiz.wrong[i]); }
    }
    if (uniq.length) {
      var cap = document.createElement("p");
      cap.className = "qprompt";
      cap.textContent = "틀린 글자 — 다시 들어 보세요";
      elWrongBox.appendChild(cap);
    }
    var grid = document.createElement("div");
    grid.className = "wronggrid";
    for (var j = 0; j < uniq.length; j++) {
      (function (idx) {
        var it = ITEMS[idx];
        var cell = document.createElement("button");
        cell.type = "button";
        cell.className = "wgitem";
        cell.setAttribute("aria-label", it.glyph + " 소리 듣기");
        var g = document.createElement("span");
        g.className = "g";
        g.textContent = it.glyph;
        var t = document.createElement("span");
        t.className = "t";
        t.textContent = (it.name || it.snd || it.glyph);
        var i = document.createElement("span");
        i.className = "i";
        i.textContent = "🔊";
        cell.appendChild(g); cell.appendChild(t); cell.appendChild(i);
        cell.addEventListener("click", function () { playItem(it, RATE_NORMAL, {}); });
        grid.appendChild(cell);
      })(uniq[j]);
    }
    elWrongBox.appendChild(grid);

    elCardCount.textContent = totalQ + " / " + totalQ;
    elPanelQuiz.hidden = true;
    elPanelResult.hidden = false;
  }

  document.getElementById("btnQuizReplay").addEventListener("click", function () { speakQuiz(RATE_NORMAL); });
  document.getElementById("btnQuizSlow").addEventListener("click", function () { speakQuiz(RATE_SLOW); });
  document.getElementById("btnQuizAgain").addEventListener("click", function () { startQuiz(); });
  document.getElementById("btnGoLearn").addEventListener("click", function () { showTab("learn"); });

  /* ───────────── 탭 ───────────── */
  function showTab(which) {
    stopAll();
    var learn = (which === "learn");
    state.tab = which;
    tabLearn.className = "tab" + (learn ? " on" : "");
    tabQuiz.className = "tab" + (learn ? "" : " on");
    tabLearn.setAttribute("aria-selected", learn ? "true" : "false");
    tabQuiz.setAttribute("aria-selected", learn ? "false" : "true");

    elPanelResult.hidden = true;
    if (learn) {
      elPanelQuiz.hidden = true;
      elPanelLearn.hidden = false;
      renderCard();
    } else {
      elPanelLearn.hidden = true;
      if (quiz.on) { elPanelQuiz.hidden = false; renderQuestion(); }
      else { startQuiz(); }
    }
  }

  tabLearn.addEventListener("click", function () { showTab("learn"); });
  tabQuiz.addEventListener("click", function () { showTab("quiz"); });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stopAll(); }
  });

  /* ───────────── 시작 ───────────── */
  window.__HANGUL1 = {
    ITEMS: ITEMS, state: state, AUD: AUD, play: playLog,
    goTo: goTo, speakCard: speakCard, speakQuiz: speakQuiz, TOTAL: TOTAL
  };
  renderCard();
})();
</script>
</body>
</html>
